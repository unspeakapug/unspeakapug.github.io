<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="/Logo.png">
<link rel="stylesheet" href="style.css">
<script src="Scripts/Theme.js" defer></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
</head>

<body class="page-404 universal-taskbar">

<div class="taskbar">
  <div class="theme-control">
    <button id="themeToggle">🎨</button>

    <div class="theme-dropdown" id="themeDropdown">

      <span class="theme-label">Accent Color</span>
      <input type="color" id="accentPicker">

      <span class="theme-label">Background Color</span>
      <input type="color" id="bgPicker">

      <span class="theme-label">Defaults</span>
      <div class="theme-buttons">
        <button id="lightMode">Light</button>
        <button id="darkMode">Dark</button>
      </div>

    </div>
  </div>
</div>

<div class="hero">
  <h1>404 - Page Not Found</h1>
  <p>The page you're looking for either doesn't exist, was moved, or never existed.</p>
</div>

<div class="container">
  <div class="card">
    <h2>Lost in the Wiki?</h2>
    <p>Even the Doog gets lost sometimes. Return back to the home page,</p>
    <a class="home-btn" href="index.html">Return Home</a>
  </div>
</div>

<div class="footer">© 2026 Puggy/RK. All rights reserved.</div>

</html>
