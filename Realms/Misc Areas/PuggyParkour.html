<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="../../Logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puggy Realm - Misc: Parkour</title>

<style>
:root {
  --bg: #12121d;
  --text: #ffffff;
  --accent1: #6366f1;
  --accent2: #4f46e5;
  --card: rgba(255,255,255,0.05);
  --card-hover: rgba(99,102,241,0.1);
  --shadow: rgba(0,0,0,0.5);
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}

a { color: var(--accent1); text-decoration: none; }
a:hover { text-decoration: underline; }

.taskbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: #1e1f29;
  padding: 10px 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 1000;
  box-shadow: 0 2px 12px var(--shadow);
}

.taskbar a {
  padding: 8px 16px;
  background: #1c1d28;
  border-radius: 8px;
  font-weight: bold;
  color: var(--accent1);
  transition: 0.3s;
}

.taskbar a:hover {
  background: #2c2f33;
  color: #fff;
}

.container {
  max-width: 1000px;
  margin: 120px auto 50px;
  padding: 30px;
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 10px 30px var(--shadow);
  text-align: center;
}

h1 {
  color: var(--accent1);
  font-size: 2.8rem;
  margin-bottom: 10px;
}

.page-desc {
  font-size: 1.2rem;
  line-height: 1.6;
  margin-bottom: 30px;
}

.section-title {
  color: var(--accent1);
  font-size: 1.8rem;
  margin-bottom: 20px;
}

.screenshot-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 20px;
  list-style: none;
  padding: 0;
}

.screenshot-card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--accent1);
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.3s, border-color 0.3s, background 0.3s;
  box-shadow: 0 4px 15px var(--shadow);
  text-align: center;
}

.screenshot-card:hover {
  transform: scale(1.03);
  border-color: var(--accent2);
  background: var(--card-hover);
}

.screenshot-card img {
  width: 100%;
  border-bottom: 1px solid var(--accent1);
  border-radius: 12px 12px 0 0;
}

.screenshot-card p {
  padding: 15px;
  font-size: 1rem;
  line-height: 1.4;
  color: var(--text);
}

</style>
</head>
<body>

<div class="taskbar">
  <a href="../../index.html">Home</a>
  <a href="../../General/Announcements.html">Announcements</a>
  <a href="../../General/Doog.html">The Doog</a>
  <a href="../../General/puggyrealm.html">Puggy Realm</a>
  <a href="../../General/Puggy.html">Puggy Bot</a>
</div>

<div class="container">
  <h1>Realm Parkour</h1>
  <p class="page-desc">
    
  </p>

  <h2 class="section-title">Parkour Area Preview</h2>
  <ul class="screenshot-grid">
    <li class="screenshot-card">
      <img src="Realm_Parkour.png" alt="Parkour">
      <p>Preview of the Parkour Area showing platforms and obstacles where players can test their skills.</p>
    </li>
  </ul>
</div>

</body>
</html>
