<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="../Logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puggy Realm - Other</title>

<style>
:root {
  --bg: #12121d;
  --text: #ffffff;
  --accent1: #6366f1;
  --accent2: #4f46e5;
  --card: rgba(255,255,255,0.05);
  --card-hover: rgba(99,102,241,0.1);
  --shadow: rgba(0,0,0,0.5);
}

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.taskbar {
  position: fixed;
  top: 0;
  width: 100%;
  background: #1e1f29;
  padding: 10px 0;
  display: flex;
  justify-content: center;
  gap: 10px;
  z-index: 1000;
  box-shadow: 0 2px 12px var(--shadow);
}

.taskbar a {
  padding: 8px 16px;
  background: #1c1d28;
  border-radius: 8px;
  font-weight: bold;
  color: var(--accent1);
  transition: 0.3s;
}
.taskbar a:hover {
  background: #2c2f33;
  color: #fff;
}

.container {
  max-width: 900px;
  margin: 120px auto 50px;
  padding: 30px;
  background: var(--card);
  border-radius: 16px;
  box-shadow: 0 10px 30px var(--shadow);
  text-align: center;
}

h1 {
  color: var(--accent1);
  font-size: 2.6rem;
  margin-bottom: 15px;
}

.page-desc {
  font-size: 1.1rem;
  line-height: 1.6;
  margin-bottom: 40px;
}

.links-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 25px;
}

.link-card {
  background: var(--card);
  border: 1px solid var(--accent1);
  border-radius: 12px;
  padding: 25px;
  box-shadow: 0 4px 15px var(--shadow);
  transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background-color 0.25s ease;
}

.link-card:hover {
  transform: translateY(-6px);
  background-color: var(--card-hover);
  border-color: var(--accent2);
  box-shadow: 0 10px 25px rgba(99,102,241,0.45);
}

.link-card a {
  font-size: 1.2rem;
  font-weight: bold;
  text-decoration: none;
  color: #80bfff;
}

.link-card a:hover {
  text-decoration: underline;
}
</style>

<style>/*MOBILE STUFFS AGAIN*/
@media (max-width: 768px) {

.taskbar {
    flex-wrap: wrap;
    justify-content: center;
    position: static;
    padding: 12px;
    gap: 8px;
  }

  .taskbar a {
    flex: 1 1 45%;
    text-align: center;
    padding: 10px 0;
    font-size: 0.95rem;
  }

  .container { 
    margin: 20px auto 40px; 
    padding: 20px; 
  }
}
</style>
</head>
<body>

<div class="taskbar">
    <a href="../index.html">Home</a>
    <a href="../General/Announcements.html">Announcements</a>
    <a href="../General/Doog.html">The Doog</a>
    <a href="../General/puggyrealm.html">Puggy Realm</a>
    <a href="../General/Puggy.html">Puggy Bot</a>
</div>

<div class="container">
    <h1>Puggy Realm Other</h1>
    <p class="page-desc">
        This page contains content that doesn’t fit into the main categories.
    </p>

    <div class="links-grid">
        <div class="link-card">
            <a href="Other/PuggyRelics.html">Relics</a>
        </div>
        <div class="link-card">
            <a href="realm_lore.html">Lore / Stories</a>
        </div>
    </div>
</div>

</body>
</html>
